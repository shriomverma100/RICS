<title>Narmada Hybrid</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: dark top bar with section pills · stage card (visual) on the left · floating glass guide panel on the right that drives the story with Enter. Single light look by design. */
:root{
  color-scheme:light;
  --bg:#E7E5E0; --card:#F3F2EE; --paper:#FFFFFF; --ink:#1C1C1A; --muted:#6C6B65; --line:#D8D6CF; --line2:#C9C6BD;
  --bar:#2A2927; --pill:#3B3A36; --pill-ink:#ECEAE3;
  --lime:#DCD45C; --lime-soft:#EFEBB6; --olive:#A39A26;
  --solar:#D49A12; --wind:#3E9378; --hydro:#3767C9; --bess:#7E5DC4; --grid:#77756D; --carbon:#5F9334; --risk:#C2553D; --accent:#A39A26; --muted-c:#9C9A92;
  --sans:"Geist","Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--olive);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr)}
/* top bar */
.top{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:stretch;padding-right:max(0px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;padding:16px 46px 16px max(28px,env(safe-area-inset-left,0px))}
.brand i{width:26px;height:26px;border-radius:7px;background:var(--bar);display:grid;place-items:center}
.brand i::after{content:"";width:12px;height:12px;border-radius:3px;background:var(--lime)}
.brand b{font-weight:400;font-size:23px;letter-spacing:-.6px}
.bar{background:var(--bar);display:flex;align-items:center;gap:8px;padding:14px max(20px,env(safe-area-inset-right,0px)) 14px 64px;clip-path:polygon(0 0,100% 0,100% 100%,52px 100%);min-width:0}
.pills{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;min-width:0}
.pills::-webkit-scrollbar{display:none}
.pill{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;background:var(--pill);color:var(--pill-ink);padding:10px 16px;font-size:14px;font-weight:500;white-space:nowrap}
.pill .n{font-family:var(--mono);font-size:11px;opacity:.7}
.pill[aria-current="true"]{background:var(--paper);color:var(--ink)}
.pill:hover:not([aria-current="true"]){background:#4A4944}
.barright{margin-left:auto;display:flex;align-items:center;gap:12px;padding-left:12px}
.keyhint{color:var(--pill-ink);font-size:13px;white-space:nowrap}
.lime-btn{background:var(--lime);color:var(--ink);border:0;border-radius:999px;padding:10px 18px;font-weight:500;white-space:nowrap}
/* main */
.main{display:grid;grid-template-columns:minmax(0,1fr) 410px;gap:22px;padding:22px max(22px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(22px,env(safe-area-inset-left,0px));min-height:0}
.main.noguide{grid-template-columns:minmax(0,1fr) 0}
.stage{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:26px 28px 22px;display:flex;flex-direction:column;min-height:0;min-width:0}
.chiprow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chip-lime{display:inline-flex;align-items:center;gap:7px;background:var(--lime);border-radius:999px;padding:5px 14px;font-size:13.5px;font-weight:500}
.chip-lime::before{content:"";width:8px;height:8px;border-radius:50%;border:1.6px solid var(--ink)}
.chip-o{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--paper);border-radius:999px;padding:4px 12px;font-size:13px;color:var(--ink)}
.stage h1,.stage h2{font-weight:300;letter-spacing:-1.6px;line-height:1.02;margin:14px 0 8px;text-wrap:balance}
.stage h1{font-size:clamp(40px,5vw,76px);letter-spacing:-2.6px}
.stage h2{font-size:clamp(28px,3.1vw,48px)}
.sub{color:var(--muted);font-size:16px;max-width:70ch;margin:0 0 14px}
.builton{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
.builton small{font-size:12px;letter-spacing:.08em;color:var(--muted);margin-right:4px}
.visual{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;border-radius:20px;background:var(--paper);border:1px solid var(--line);overflow:hidden}
.visual.bare{background:transparent;border:0}
.vhead{display:flex;align-items:center;gap:10px;padding:10px 14px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.vhead b{color:var(--ink);font-weight:500}
.vhead .sp{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.tog{border:1px solid var(--line2);background:var(--paper);border-radius:999px;padding:4px 12px;font-size:12.5px}
.tog[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.vbody{position:relative;flex:1;min-height:0;overflow:auto}
.vbody.center{display:flex;align-items:center;justify-content:center;padding:8px 14px}
.vbody > svg{display:block;width:100%;height:100%;max-height:100%}
.vnote{font-size:12px;color:var(--muted);padding:8px 14px;border-top:1px solid var(--line)}
/* guide panel */
.guide{background:rgba(243,242,238,.94);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:22px;box-shadow:0 18px 40px rgba(40,38,30,.10);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.ghead{display:flex;align-items:center;gap:8px;padding:14px 18px;border-bottom:1px solid var(--line)}
.badge{background:var(--bar);color:#fff;border-radius:7px;padding:2px 8px;font-size:12px;font-weight:600}
.ghead .sec{font-size:13px;color:var(--muted)}
.ghead .cnt{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted)}
.ghead .x{border:0;background:none;color:var(--muted);font-size:16px;padding:0 4px}
.gbody{padding:16px 18px;overflow-y:auto;flex:1;min-height:0;display:flex;flex-direction:column;gap:12px}
.gbody h3{font-weight:400;font-size:25px;letter-spacing:-.6px;line-height:1.15;margin:0;text-wrap:balance}
.box{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14px}
.box.now{border-color:var(--olive);box-shadow:0 0 0 3px var(--lime-soft)}
.lab{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.plist button{width:100%;display:grid;grid-template-columns:28px 1fr;gap:6px;align-items:baseline;text-align:left;border:0;background:none;border-radius:10px;padding:6px 8px;font-size:14px;color:var(--muted)}
.plist button .n{font-family:var(--mono);font-size:11.5px}
.plist button.past{color:var(--ink)}
.plist button.past .n::before{content:"✓ ";color:var(--olive)}
.plist button.now{background:var(--paper);color:var(--ink);font-weight:500;box-shadow:inset 0 0 0 1px var(--line)}
.plist button.now .n{color:var(--olive)}
.why{font-size:13px;color:var(--muted)}
.why b{color:var(--ink);font-weight:600}
.gfoot{border-top:1px solid var(--line);padding:12px 18px 14px;display:flex;flex-direction:column;gap:12px}
.dashes{display:flex;gap:4px}
.dashes i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.dashes i.done{background:var(--olive)}
.dashes i.on{background:var(--ink)}
.gbtns{display:flex;align-items:center;gap:8px}
.gbtns .restart{border:0;background:none;color:var(--muted);text-decoration:underline;font-size:13px;padding:0}
.gbtns .back{margin-left:auto;border:1px solid var(--line2);background:var(--paper);border-radius:999px;padding:9px 18px}
.gbtns .next{border:0;background:var(--lime);border-radius:999px;padding:10px 20px;font-weight:500}
kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--paper);color:var(--ink)}
/* 3d */
#three{position:absolute;inset:0;border-radius:20px;overflow:hidden}
#three canvas{display:block;width:100%!important;height:100%!important;cursor:grab}
.lbl{position:absolute;transform:translate(-50%,-100%);font-size:12px;font-weight:500;padding:4px 10px 4px 8px;border-radius:999px;background:rgba(255,255,255,.95);color:var(--ink);border:1px solid var(--line2);white-space:nowrap;cursor:pointer;display:flex;align-items:center;gap:6px;box-shadow:0 4px 10px rgba(0,0,0,.08)}
.lbl::after{content:"";position:absolute;left:50%;top:100%;width:1px;height:12px;background:rgba(255,255,255,.9)}
.lbl i{width:9px;height:9px;border-radius:50%}
.lbl.hot{background:var(--lime);border-color:var(--olive);z-index:2}
.lbl.dim{opacity:.6}
.readout{position:absolute;right:12px;top:12px;background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:16px;padding:10px 12px;font-size:12.5px;min-width:220px;z-index:3;box-shadow:0 8px 20px rgba(0,0,0,.08)}
.readout h5{margin:0 0 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.readout .row{display:grid;grid-template-columns:12px 1fr auto;gap:8px;align-items:center;font-family:var(--mono);font-size:12px;padding:1px 0}
.readout .row i{width:9px;height:9px;border-radius:50%}
.readout .tot{border-top:1px solid var(--line);margin-top:4px;padding-top:5px;font-weight:600}
.readout p{margin:6px 0 0;color:var(--muted);font-size:12px;max-width:240px;font-family:var(--sans)}
.hint3d{position:absolute;left:12px;bottom:12px;font-size:12px;color:var(--ink);background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:999px;padding:4px 12px}
.webglfail{padding:24px;color:var(--muted)}
/* diagrams */
.dg .node{cursor:grab}
.dg .node .card{fill:var(--paper);stroke:var(--line2);stroke-width:1}
.dg .node .halo{fill:none;stroke:var(--lime);stroke-width:0;opacity:.8}
.dg .node .t{font:500 13px var(--sans);fill:var(--ink)}
.dg .node .s{font:400 10.5px var(--mono);fill:var(--muted)}
.dg .node.hot .card{stroke:var(--olive);stroke-width:1.8}
.dg .node.hot .halo{stroke-width:6}
.dg.focus .node:not(.hot){opacity:.38}
.dg .edge{fill:none;stroke:var(--muted-c);stroke-width:1.5;stroke-dasharray:2 5;stroke-linecap:round}
.dg .edge.flow{animation:flow 1.2s linear infinite}
.dg.focus .edge:not(.hot){opacity:.2}
.dg .edge.hot{stroke-width:2.4}
.dg .elab{font:400 10.5px var(--mono);fill:var(--muted)}
.dg .node,.dg .edge{transition:opacity .25s}
@keyframes flow{to{stroke-dashoffset:-14}}
/* charts, tables, cards */
.ax{font:400 11px var(--mono);fill:var(--muted)}
.axl{stroke:var(--line);stroke-width:1}
.ttl{font:500 12.5px var(--sans);fill:var(--ink)}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;padding:10px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--paper)}
.tbl td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td:first-child{font-weight:500}
.tbl td.num{font-family:var(--mono);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.tbl tr{transition:opacity .25s,background .25s}
.tbl tr.hot td{background:var(--lime-soft)}
.tbl tr.dim{opacity:.45}
.pass{color:var(--carbon);font-weight:600}.fail{color:var(--risk);font-weight:600}
.kpis{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:10px 14px;min-width:150px}
.kpi small{display:block;font-size:12px;color:var(--muted)}
.kpi b{font-weight:400;font-size:26px;letter-spacing:-.6px;font-variant-numeric:tabular-nums}
.rank{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;padding:16px;align-content:start}
.rcard{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px;transition:opacity .25s,box-shadow .25s,border-color .25s;min-width:0}
.rcard.hot{border-color:var(--olive);box-shadow:0 0 0 4px var(--lime-soft)}
.rcard.dim{opacity:.45}
.rcard .top2{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--mono);font-size:12px;color:var(--muted)}
.rcard .score{font-family:var(--sans);font-size:24px;font-weight:300;color:var(--ink);letter-spacing:-.5px}
.rcard h4{margin:0;font-size:15px;font-weight:500;line-height:1.25}
.rcard .meter{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.rcard .meter i{display:block;height:100%;background:var(--olive)}
.rcard p{margin:0;font-size:12.5px;color:var(--muted)}
.rcard p b{color:var(--ink);font-weight:500}
@media (max-width:1100px){.rank{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:1500px){.keyhint{display:none}}
@media (max-width:1000px){
  body{overflow:auto}
  .app{height:auto}
  .main{grid-template-columns:1fr}
  .main.noguide{grid-template-columns:1fr}
  .visual{min-height:440px}
  .guide{max-height:none}
  .brand{padding-right:24px}
  .keyhint{display:none}
}
@media (max-width:560px){.rank{grid-template-columns:1fr}.stage{padding:18px 16px}.brand b{font-size:19px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <header class="top">
    <div class="brand"><i aria-hidden="true"></i><b>narmada hybrid</b></div>
    <div class="bar">
      <nav class="pills" id="pills" aria-label="Sections"></nav>
      <div class="barright"><span class="keyhint"><kbd>Enter</kbd> next · <kbd>←</kbd> back</span><button class="lime-btn" id="guideToggle" type="button">Guide</button></div>
    </div>
  </header>
  <div class="main" id="main">
    <section class="stage" id="stage" aria-live="polite"></section>
    <aside class="guide" id="guide" aria-label="Presenter guide">
      <div class="ghead"><span class="badge">Guide</span><span class="sec" id="gsec"></span><span class="cnt" id="gcnt"></span><button class="x" id="gclose" type="button" aria-label="Hide guide">×</button></div>
      <div class="gbody" id="gbody"></div>
      <div class="gfoot"><div class="dashes" id="dashes"></div>
        <div class="gbtns"><button class="restart" id="restart" type="button">Restart</button><button class="back" id="back" type="button">Back</button><button class="next" id="next" type="button">Next ↵</button></div></div>
    </aside>
  </div>
</div>

    const svg=ch.svg,pe=kp("Equity payback"),xp=ch.X(pe),mk=S("g",{},svg);S("line",{x1:xp,x2:xp,y1:ch.y0,y2:ch.y1,style:"stroke:var(--risk);stroke-dasharray:4 4"},mk);S("text",{x:xp+6,y:ch.y0+14,class:"ax",style:"fill:var(--risk)",text:`equity break-even ≈ year ${pe.toFixed(1)}`},mk);
    const inv=S("rect",{x:ch.X(0),y:ch.y0,width:ch.X(2.5)-ch.X(0),height:ch.y1-ch.y0,style:"fill:var(--risk);opacity:0"},svg);b.appendChild(svg);
    return{step(i,st){inv.style.opacity=st&&st.i==="invest"?.08:0;mk.style.opacity=st&&(st.i==="pay"||st.i==="all")?1:.35;}};},
  feas(s){const {b}=vbox(s);const rows=DATA.feas.filter(r=>r[0]!=="Test").map(r=>{const ip=/IRR/.test(r[0]),dd=/DSCR/.test(r[0]);
      return[r[0],ip?pct(r[1]):dd?r[1].toFixed(2)+"×":inr(r[1],2),r[2]==null?"":ip?pct(r[2]):dd?Number(r[2]).toFixed(2)+"×":inr(r[2],2),r[3]?`<span class="${r[3]==="PASS"?"pass":"fail"}">${r[3]}</span>`:""];});
    const t=table([{h:"Test / benchmark"},{h:"Ours",num:1},{h:"Threshold / market",num:1},{h:"Result"}],rows);b.appendChild(t.el);return{step(i,st){t.hl(st&&st.i?st.i:null);}};},
  sens(s){const {v,b}=vbox(s);const sc=SENS.filter(r=>r[3]!=null);const rows=sc.map(r=>({n:r[0].replace(/\s*\(.*\)/,"").replace("Combined downside: tariff −10%, capex +10%, generation −5%","Combined downside"),v:[Math.max(0,r[2])],c:[r[2]>=.14?"--carbon":r[2]>=.1?"--solar":"--risk"]}));
    const ch=hbars(rows,{c:["--olive"],x0:280,rh:25,max:.2,ref:.14,refLabel:"14% hurdle",fmt:r=>pct(r.v[0])});b.appendChild(ch.svg);
    const be=SENS.filter(r=>r[3]==null);v.appendChild(H("div",{class:"vnote"},"Break-even FDRE tariffs · "+be.map(r=>`${r[0].replace("Tariff at which ","")}: ₹${r[1].toFixed(2)}`).join(" · ")));
    return{step(i,st){ch.hl(st&&st.i?st.i:null);}};},
  gantt(s){const {v,b}=vbox(s);const rows=[["MoU + JV with NHDC",-12,-9,"olive"],["Surveys: bathymetry, geotech",-11,-6,"grid"],["Wind measurement (12 months)",-10,2,"wind"],["DPR, PPA, financial close",-8,0,"carbon"],
      ["AI-EMS on existing hydro",0,3,"olive",3],["Pooling substation",0,12,"grid"],["FPV blocks 1–2 (100 MW)",2,9,"solar",9],["FPV blocks 3–6",10,22,"solar",22],["Battery storage",8,18,"bess",18],["Wind gate decision",2,2,"wind",2],["Wind construction",14,30,"wind",30],["Full commercial operation",30,30,"risk",30]];

/* ============================== NAVIGATION ============================== */
let cur=0,step=0,vis=null;
const stage=document.getElementById("stage"),gbody=document.getElementById("gbody");
const secName=id=>SECTIONS.find(s=>s[0]===id)[1];
function buildPills(){const p=document.getElementById("pills");SECTIONS.forEach(([id,name,n,short])=>{const b=H("button",{class:"pill",type:"button","data-sec":id,title:name},`${n==="0"?"":`<span class="n">${n}</span>`}${short}`);b.addEventListener("click",()=>go(DECK.findIndex(d=>d.sec===id),0));p.appendChild(b);});}
function render(){
  const s=DECK[cur];P3.unmount();
  stage.innerHTML="";
  const cr=H("div",{class:"chiprow"});cr.appendChild(H("span",{class:"chip-lime"},s.chip||(SECTIONS.find(x=>x[0]===s.sec)[2]==="0"?"Why this site":`${SECTIONS.find(x=>x[0]===s.sec)[2]} · ${secName(s.sec)}`)));
  const inSec=DECK.filter(d=>d.sec===s.sec),pos=inSec.indexOf(s)+1;cr.appendChild(H("span",{class:"chip-o"},`${pos} of ${inSec.length} in this section`));stage.appendChild(cr);
  stage.appendChild(H(s.h1?"h1":"h2",{},s.title));
  if(s.sub)stage.appendChild(H("p",{class:"sub"},s.sub));
  if(s.built){const bo=H("div",{class:"builton"},"<small>BUILT ON</small>");s.built.forEach(t=>bo.appendChild(H("span",{class:"chip-o"},t)));stage.appendChild(bo);}
  if(s.kpis){const k=H("div",{class:"kpis"});s.kpis.forEach(([a,b])=>k.appendChild(H("div",{class:"kpi"},`<small>${a}</small><b>${b}</b>`)));stage.appendChild(k);k.style.marginBottom="12px";}
  vis=BUILD[s.v.type](s);stage.appendChild(stageVis);
  document.querySelectorAll(".pill").forEach(p=>p.setAttribute("aria-current",String(p.dataset.sec===s.sec)));
  const ap=document.querySelector(".pill[aria-current='true']");if(ap)ap.scrollIntoView({block:"nearest",inline:"nearest"});
  try{history.replaceState(null,"","#slide-"+(cur+1));}catch(e){}
  update();
}
function update(){
  const s=DECK[cur],st=s.steps[step];
  document.getElementById("gsec").textContent=secName(s.sec);
  document.getElementById("gcnt").textContent=`${cur+1} / ${DECK.length}`;
  gbody.innerHTML="";
  gbody.appendChild(H("h3",{},st[0]));
  gbody.appendChild(H("div",{class:"box now"},st[1]));
  gbody.appendChild(H("div",{class:"lab"},`Points on this slide · ${step+1} of ${s.steps.length}`));
  const ul=H("ul",{class:"plist"});s.steps.forEach((p,i)=>{const li=H("li");const b=H("button",{type:"button",class:i<step?"past":i===step?"now":""},`<span class="n">${String(i+1).padStart(2,"0")}</span><span>${p[0]}</span>`);b.addEventListener("click",()=>{step=i;update();});li.appendChild(b);ul.appendChild(li);});gbody.appendChild(ul);
  if(s.why)gbody.appendChild(H("div",{class:"why"},"<b>Why it matters:</b> "+s.why));
  gbody.appendChild(H("div",{class:"why"},"<kbd>Enter</kbd> or <kbd>→</kbd> next · <kbd>←</kbd> back · <kbd>0</kbd>–<kbd>5</kbd> jump to a section · <kbd>G</kbd> hide guide"));
  if(vis)vis.step(step,st[2]||null);
  const d=document.getElementById("dashes");d.innerHTML="";const inSec=DECK.map((x,i)=>[x,i]).filter(([x])=>x.sec===s.sec);
  inSec.forEach(([x,i])=>{const e=H("i",{class:i<cur?"done":i===cur?"on":""});e.title=x.title;d.appendChild(e);});
  document.getElementById("back").disabled=cur===0&&step===0;
  document.getElementById("next").textContent=(cur===DECK.length-1&&step===s.steps.length-1)?"Done":"Next ↵";
}
function go(i,st){cur=Math.max(0,Math.min(DECK.length-1,i));step=st==="last"?DECK[cur].steps.length-1:st;render();}
function next(){if(step<DECK[cur].steps.length-1){step++;update();}else if(cur<DECK.length-1)go(cur+1,0);}
function prev(){if(step>0){step--;update();}else if(cur>0)go(cur-1,"last");}
function toggleGuide(){const g=document.getElementById("guide"),m=document.getElementById("main");g.hidden=!g.hidden;m.classList.toggle("noguide",g.hidden);}
document.getElementById("next").addEventListener("click",next);
document.getElementById("back").addEventListener("click",prev);
document.getElementById("restart").addEventListener("click",()=>go(0,0));
document.getElementById("gclose").addEventListener("click",toggleGuide);
document.getElementById("guideToggle").addEventListener("click",toggleGuide);
document.addEventListener("keydown",e=>{
  if(e.target.closest&&e.target.closest("input,textarea,select"))return;
  if(e.key==="Enter"||e.key==="ArrowRight"||e.key==="PageDown"||e.key===" "){e.preventDefault();next();}
  else if(e.key==="ArrowLeft"||e.key==="PageUp"||e.key==="Backspace"){e.preventDefault();prev();}
  else if(/^[0-5]$/.test(e.key)){go(DECK.findIndex(d=>d.sec===SECTIONS[+e.key][0]),0);}
  else if(e.key==="g"||e.key==="G"){toggleGuide();}
  else if(e.key==="Home"){go(0,0);}else if(e.key==="End"){go(DECK.length-1,0);}
});
buildPills();
const mh=/^#slide-(\d+)$/.exec(location.hash);go(mh?Math.min(DECK.length,+mh[1])-1:0,0);
window.addEventListener("hashchange",()=>{const h=/^#slide-(\d+)$/.exec(location.hash);if(h&&+h[1]-1!==cur)go(+h[1]-1,0);});
</script>
